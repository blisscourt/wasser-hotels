<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Wasser Hotel | Luxury Accommodation, Dining & Hospitality</title>
    <meta
      name="description"
      content="Experience exceptional hospitality at Wasser Hotel. Enjoy comfortable accommodation, elegant rooms, quality dining, and a relaxing hotel experience tailored to your stay."
    />
    <meta
      name="keywords"
      content="Wasser Hotel, hotel accommodation, luxury hotel, comfortable hotel rooms, hotel dining, hospitality, hotel reservations, hotel booking"
    />
    <meta name="author" content="Wasser Hotel" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Canonical URL: Replace with your actual website URL -->
    <link rel="canonical" href="https://www.wasserhotels.com/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wasser Hotel | Exceptional Hospitality & Comfort" />
    <meta
      property="og:description"
      content="Discover comfort, elegant accommodation, quality dining, and personalized hospitality at Wasser Hotel."
    />
    <meta property="og:url" content="https://www.wasserhotels.com/" />
    <meta property="og:site_name" content="Wasser Hotel" />
    <meta property="og:image" content="https://www.wasserhotels.com/og-image.jpg" />
    <meta property="og:image:alt" content="Wasser Hotel – Elegant accommodation and exceptional hospitality" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wasser Hotel | Exceptional Hospitality & Comfort" />
    <meta
      name="twitter:description"
      content="Experience comfortable accommodation, elegant rooms, fine dining, and personalized hospitality at Wasser Hotel."
    />
    <meta name="twitter:image" content="https://www.wasserhotels.com/og-image.jpg" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
